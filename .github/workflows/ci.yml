name: ci

# One job per gate, one status check per job.
#
# GitHub reports an Actions job under its `name:`, and that string is what the `main` branch
# ruleset lists in `required_status_checks`. So the `name:` values below are a CONTRACT with the
# ruleset, not decoration: renaming one makes a required check unreportable and blocks every PR
# until the ruleset is edited to match. Do not add a `strategy.matrix` to one of these jobs either:
# GitHub would report it as `<name> (<value>)` and the required context would never arrive.
#
# The gates run on the Node floor from `.nvmrc`. Newer Node is exercised by the separate,
# non-required `node-latest` workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # pharn-ci posts its diff-coverage comment, so this one job needs `pull-requests: write`.
    # A job-level block replaces the workflow-level one, so `contents: read` is repeated.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:coverage
      # Only on pull requests and merge groups: on a push it would gate main against the previous commit.
      - id: pharn-ci
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: pharn-dev/pharn-ci@0873ce23f3595a3497325635b7bf3ee93ea77687 # v0.2.0
        timeout-minutes: 5
        with:
          # A weakened test (deleted, skipped, focused, or a loosened script, workflow or config) fails the check;
          # a reviewer who is not the PR author signs it off with the pharn/accepted label.
          # Only on pull requests: the merge queue never reads the label, so block there would fail a signed-off PR.
          test-integrity: ${{ github.event_name == 'pull_request' && 'block' || 'warn' }}
      - if: always() && steps.pharn-ci.outputs.report-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-report
          path: ${{ steps.pharn-ci.outputs.report-path }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check exports (ESM + CJS)
        run: npm run check:exports
      # Tarball hygiene: no test fixtures, .ts sources or files outside dist/ ship, every source map
      # carries its sources, every "exports" target ships, and engines.node matches .nvmrc.
      - name: Check package contents and Node floor
        run: npm run check:package
      - name: Pack
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/pkg"
      - name: Smoke the packed package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run check:install -- "$RUNNER_TEMP/pkg/$TARBALL"

  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that every action is pinned to a commit SHA
        run: node scripts/check-action-pins.mjs
