name: node-latest

# Not a required check: confirms the package still builds, tests and loads (ESM and CJS) on the
# newest Node, while the required gates in ci.yml run on the Node floor from .nvmrc.
#
# The `platform-smoke` job runs the same checks on Windows and macOS on the Node floor, because
# ci.yml runs on Linux only and some code paths are platform-specific (plugin child script paths,
# the symbolizer worker, process groups in check:install). Its job names must never equal a
# required check name in the `main` ruleset (Format check, Lint, Typecheck, Test, Build,
# Action pins, ...), or a failure here would block every PR.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays at 07:00 UTC, so a new Node release is noticed without a PR.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check exports (ESM + CJS)
        run: npm run check:exports
      - name: Check package contents and Node floor
        run: npm run check:package
      - name: Pack
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/pkg"
      - name: Smoke the packed package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run check:install -- "$RUNNER_TEMP/pkg/$TARBALL"

  platform-smoke:
    name: Platform smoke (${{ matrix.os }}, node floor)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check exports (ESM + CJS)
        run: npm run check:exports
      - name: Test
        run: npm test
